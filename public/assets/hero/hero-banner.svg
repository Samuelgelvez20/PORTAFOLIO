<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#0D172A"/>
      <stop offset="100%" stop-color="#080E18"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="electric-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#55B9F5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162032" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>
  <rect width="900" height="240" rx="14" fill="url(#electric-glow)"/>

  <!-- Left Architectural Accent Line -->
  <rect x="0" y="24" width="4" height="192" rx="2" fill="#55B9F5"/>

  <!-- Decorative Corner Crosshairs -->
  <g stroke="#55B9F5" stroke-width="1" opacity="0.4">
    <path d="M 35 25 L 45 25 M 40 20 L 40 30" />
    <path d="M 855 25 L 865 25 M 860 20 L 860 30" />
    <path d="M 35 215 L 45 215 M 40 210 L 40 220" />
    <path d="M 855 215 L 865 215 M 860 210 L 860 220" />
  </g>

  <!-- Content Group -->
  <g transform="translate(60, 48)">
    <!-- Subtitle / Meta Badge -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#55B9F5">
      ENGINEERING IDENTITY
    </text>

    <!-- Full Name -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="32" font-weight="800" letter-spacing="0.5" fill="#EAF0F7">
      Samuel David Gélvez Rodríguez
    </text>

    <!-- Professional Roles -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.5" fill="#94A3B8">
      Software Engineer <tspan fill="#55B9F5">|</tspan> Backend Developer <tspan fill="#55B9F5">|</tspan> Software Architecture
    </text>

    <!-- Horizontal Divider -->
    <line x1="0" y1="112" x2="780" y2="112" stroke="#1E293B" stroke-width="1" />

    <!-- Headline Motto -->
    <text x="0" y="136" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" font-weight="500" fill="#55B9F5">
      &gt; Building reliable systems. Engineering meaningful solutions.
    </text>
  </g>
</svg>
